name: amar_hisab
description: Offline Bengali remittance accounting with an auditable ledger.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  cryptography: ^2.7.0
  file_picker: ^10.3.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  share_plus: ^11.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSerifBengali
      fonts:
        - asset: assets/fonts/NotoSerifBengali.ttf
